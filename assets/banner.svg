<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>
    <linearGradient id="title-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22d3ee" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <style>
      @keyframes floatSlow {
        0%, 100% { transform: translate(0px, 0px) scale(1); }
        50% { transform: translate(30px, -20px) scale(1.08); }
      }
      @keyframes floatFast {
        0%, 100% { transform: translate(0px, 0px); }
        50% { transform: translate(-25px, 25px); }
      }
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.35; }
        50% { opacity: 0.7; }
      }
      @keyframes radarMove {
        0% { transform: translateX(0); opacity: 0; }
        20% { opacity: 0.6; }
        80% { opacity: 0.6; }
        100% { transform: translateX(1280px); opacity: 0; }
      }
      .orb-1 { animation: floatSlow 8s ease-in-out infinite; }
      .orb-2 { animation: floatFast 10s ease-in-out infinite; }
      .pulse-item { animation: pulseGlow 4s ease-in-out infinite; }
      .scan-line { animation: radarMove 6s linear infinite; }
      .font-sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1280" height="400" fill="url(#bg-grad)" />

  <!-- Background Grid Pattern -->
  <g stroke="rgba(255,255,255,0.04)" stroke-width="1">
    <line x1="0" y1="80" x2="1280" y2="80" />
    <line x1="0" y1="160" x2="1280" y2="160" />
    <line x1="0" y1="240" x2="1280" y2="240" />
    <line x1="0" y1="320" x2="1280" y2="320" />
    <line x1="160" y1="0" x2="160" y2="400" />
    <line x1="320" y1="0" x2="320" y2="400" />
    <line x1="480" y1="0" x2="480" y2="400" />
    <line x1="640" y1="0" x2="640" y2="400" />
    <line x1="800" y1="0" x2="800" y2="400" />
    <line x1="960" y1="0" x2="960" y2="400" />
    <line x1="1120" y1="0" x2="1120" y2="400" />
  </g>

  <!-- Dynamic Glowing Orbs in Background -->
  <g class="pulse-item">
    <circle cx="220" cy="120" r="140" fill="#6366f1" opacity="0.2" filter="url(#glow)" class="orb-1" />
    <circle cx="1060" cy="280" r="160" fill="#06b6d4" opacity="0.18" filter="url(#glow)" class="orb-2" />
    <circle cx="840" cy="80" r="100" fill="#ec4899" opacity="0.12" filter="url(#glow)" class="orb-1" />
  </g>

  <!-- Dynamic Scanning Beam -->
  <rect x="-100" y="0" width="120" height="400" fill="url(#accent-grad)" opacity="0.05" class="scan-line" />

  <!-- Decorative Circuit / Node Network in Background -->
  <g stroke="rgba(56, 189, 248, 0.25)" stroke-width="1.5" fill="none">
    <path d="M 100 200 L 220 200 L 260 250 L 380 250" />
    <circle cx="100" cy="200" r="4" fill="#38bdf8" />
    <circle cx="260" cy="250" r="4" fill="#818cf8" />
    <circle cx="380" cy="250" r="4" fill="#c084fc" />

    <path d="M 900 150 L 1020 150 L 1060 100 L 1180 100" />
    <circle cx="900" cy="150" r="4" fill="#38bdf8" />
    <circle cx="1060" cy="100" r="4" fill="#818cf8" />
    <circle cx="1180" cy="100" r="4" fill="#c084fc" />
  </g>

  <!-- Foreground Content: Pill Tags -->
  <g transform="translate(640, 75)" text-anchor="middle" class="font-sans">
    <rect x="-190" y="-18" width="380" height="36" rx="18" fill="rgba(30, 41, 59, 0.8)" stroke="rgba(99, 102, 241, 0.5)" stroke-width="1.5" />
    <text y="5" font-size="13" font-weight="700" fill="#38bdf8" letter-spacing="1.5">⚡ THE DEFINITIVE CURATED REGISTRY ⚡</text>
  </g>

  <!-- Main Title (Strictly Foreground, Crisp &amp; Readable) -->
  <g transform="translate(640, 155)" text-anchor="middle" class="font-sans">
    <text font-size="46" font-weight="900" fill="url(#title-grad)" letter-spacing="-0.5">Awesome API Development &amp; Testing Tools</text>
  </g>

  <!-- Subtitle -->
  <g transform="translate(640, 205)" text-anchor="middle" class="font-sans">
    <text font-size="18" font-weight="500" fill="#cbd5e1" letter-spacing="0.2">Automated QA • Contract Validation • Benchmarking • Mocking &amp; Local Clients</text>
  </g>

  <!-- Interactive Badges / Metrics Row -->
  <g transform="translate(640, 290)" class="font-sans">
    <!-- Card 1: REST &amp; GraphQL -->
    <g transform="translate(-390, 0)">
      <rect x="0" y="0" width="170" height="44" rx="10" fill="rgba(15, 23, 42, 0.85)" stroke="rgba(56, 189, 248, 0.35)" stroke-width="1.2" />
      <circle cx="24" cy="22" r="7" fill="#38bdf8" />
      <text x="42" y="27" font-size="13" font-weight="600" fill="#f8fafc">REST &amp; GraphQL</text>
    </g>

    <!-- Card 2: gRPC &amp; WebSocket -->
    <g transform="translate(-195, 0)">
      <rect x="0" y="0" width="180" height="44" rx="10" fill="rgba(15, 23, 42, 0.85)" stroke="rgba(129, 140, 248, 0.35)" stroke-width="1.2" />
      <circle cx="24" cy="22" r="7" fill="#818cf8" />
      <text x="42" y="27" font-size="13" font-weight="600" fill="#f8fafc">gRPC &amp; WebSockets</text>
    </g>

    <!-- Card 3: Contract Testing -->
    <g transform="translate(15, 0)">
      <rect x="0" y="0" width="180" height="44" rx="10" fill="rgba(15, 23, 42, 0.85)" stroke="rgba(192, 132, 252, 0.35)" stroke-width="1.2" />
      <circle cx="24" cy="22" r="7" fill="#c084fc" />
      <text x="42" y="27" font-size="13" font-weight="600" fill="#f8fafc">Contract Testing</text>
    </g>

    <!-- Card 4: Load &amp; Fuzzing -->
    <g transform="translate(225, 0)">
      <rect x="0" y="0" width="165" height="44" rx="10" fill="rgba(15, 23, 42, 0.85)" stroke="rgba(34, 211, 238, 0.35)" stroke-width="1.2" />
      <circle cx="24" cy="22" r="7" fill="#22d3ee" />
      <text x="42" y="27" font-size="13" font-weight="600" fill="#f8fafc">Load &amp; Fuzzing</text>
    </g>
  </g>
</svg>