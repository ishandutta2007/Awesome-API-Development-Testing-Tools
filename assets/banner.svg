<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1280 400"><defs><linearGradient id="bg-grad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#0a0f1d"/><stop offset="50%" stop-color="#0f172a"/><stop offset="100%" stop-color="#030712"/></linearGradient><linearGradient id="title-grad" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#38bdf8"/><stop offset="50%" stop-color="#818cf8"/><stop offset="100%" stop-color="#c084fc"/></linearGradient><linearGradient id="accent-grad" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#22d3ee"/><stop offset="100%" stop-color="#a855f7"/></linearGradient><filter id="glow" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="12"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter><style>@keyframes floatSlow{0%{transform:translate(0,0) scale(1)}50%{transform:translate(30px,-20px) scale(1.08)}}@keyframes floatFast{0%{transform:translate(0,0)}50%{transform:translate(-25px,25px)}}@keyframes pulseGlow{0%{opacity:.35}50%{opacity:.7}}@keyframes radarMove{0%{transform:translateX(0);opacity:0}20%,80%{opacity:.6}}.orb-1{animation:floatSlow 8s ease-in-out infinite}.orb-2{animation:floatFast 10s ease-in-out infinite}.pulse-item{animation:pulseGlow 4s ease-in-out infinite}.scan-line{animation:radarMove 6s linear infinite}.font-sans{font-family:-apple-system,BlinkMacSystemFont,&apos;Segoe UI&apos;,Roboto,Helvetica,Arial,sans-serif}</style></defs><rect width="1280" height="400" fill="url(#bg-grad)"/><g stroke="rgba(255,255,255,0.04)" stroke-width="1"><line x1="0" x2="1280" y1="80" y2="80"/><line x1="0" x2="1280" y1="160" y2="160"/><line x1="0" x2="1280" y1="240" y2="240"/><line x1="0" x2="1280" y1="320" y2="320"/><line x1="160" x2="160" y1="0" y2="400"/><line x1="320" x2="320" y1="0" y2="400"/><line x1="480" x2="480" y1="0" y2="400"/><line x1="640" x2="640" y1="0" y2="400"/><line x1="800" x2="800" y1="0